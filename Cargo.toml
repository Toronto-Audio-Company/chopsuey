[package]
name = "tempo_sampler"
version = "0.1.0"
edition = "2021"
description = "Shows the host tempo and stretches a loop to match it"

[workspace]
members = ["xtask", "stems_helper", "licence_format", "tools/licence_keygen"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Debug builds made with this panic on any allocation in process() (nih-plug's
# assert_no_alloc). CI and scripts/validate.sh run the validators on such a
# build so a realtime-safety regression fails loudly.
rt-checks = ["nih_plug/assert_process_allocs"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["standalone"] }
nih_plug_vizia = { git = "https://github.com/robbert-vdh/nih-plug.git" }
atomic_float = "0.1"
signalsmith-stretch = "0.1.3"
hound = "3.5.1"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustfft = "6"
libc = "0.2"
symphonia = { version = "0.6", features = ["all"] }
ttf-parser = "0.19" # measuring sidebar names for the hover marquee
licence_format = { path = "licence_format" } # signed licence keys (src/licence.rs)

[profile.release]
lto = "thin"
# Keep function names (not debug info) so panic backtraces in the log are readable.
strip = "debuginfo"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
